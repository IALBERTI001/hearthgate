<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{{ PRODUCT_NAME }}}</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2a1820; }
  #unity-canvas { display: block; width: 100%; height: 100%; background: #2a1820; outline: none; touch-action: none; }
  #load { position: fixed; left: 50%; top: 50%; width: min(320px, 60vw); height: 10px; margin-left: calc(min(320px, 60vw) / -2);
          border-radius: 5px; background: rgba(255,245,220,.18); overflow: hidden; }
  #load i { display: block; height: 100%; width: 0; background: #ffd66b; border-radius: 5px; transition: width .2s; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="load"><i></i></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
  var canvas = document.getElementById('unity-canvas');
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  createUnityInstance(canvas, {
    dataUrl: "Build/{{{ DATA_FILENAME }}}",
    frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
    codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
    symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    matchWebGLCanvasToContainer: true,
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  }, function (p) { document.querySelector('#load i').style.width = (p * 100) + '%'; })
  .then(function (u) { window.hgUnity = u; document.getElementById('load').remove(); canvas.focus(); })
  .catch(function (m) { console.error(m); });
</script>
</body>
</html>
