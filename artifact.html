<title>Hearthgate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="style.css?v=20261113b">
<style>:root{color-scheme:dark} html,body{background:#1b1016}</style>

<div id="backdrop" aria-hidden="true"></div>
<div id="stage">
  <canvas id="field" aria-label="The gate holds against the waves"></canvas>
  <header id="hud">
    <div id="wave" class="stat"><span class="lbl">Wave</span><b id="waveN">1</b></div>
    <div class="stat res"><span class="num"><i class="gem"></i><b id="res">0</b></span><span id="unit" class="sub">Resonance</span><span id="rate" class="sub rate" hidden><b id="rateN">+0/s</b></span></div>
    <div class="btns">
    <button id="stars" class="chip perksbtn" aria-label="Ascension perks" hidden></button>
    <button id="quests" class="icon" aria-label="Daily quests" hidden><i class="scroll"></i><span class="dot"></span></button>
    <button id="shop" class="icon shopbtn" aria-label="Shop" hidden><i class="star"></i><span class="dot"></span></button>
    <button id="stats" class="icon statsbtn" aria-label="Show stats"><i class="bars"></i></button>
    <button id="pause" class="icon" aria-label="Pause">II</button>
    </div>
  </header>
  <div id="counters"><span id="city" class="stat sm">City 0/10</span><span id="combos" class="stat sm">Combos 0/3</span></div>
  <div id="info" hidden></div>
  <div id="toast" role="status"></div>
  <footer id="bar">
    <button id="up" class="big"><span class="fill"></span><span class="label">Upgrade</span><span class="cost">10</span><span class="wait"></span><kbd>U</kbd></button>
    <button id="re" class="big"><span class="fill"></span><span class="label">Rebuild</span><span class="cost">15</span><span class="wait"></span><kbd>R</kbd></button>
  </footer>
  <div id="hand" aria-hidden="true"></div>
  <div id="card"><div class="body" role="dialog" aria-modal="true"></div></div>
  <div id="boot">Hearthgate</div>
</div>
<aside id="sideL" class="side" hidden></aside>
<aside id="sideR" class="side" hidden></aside>
<script>window.HG_TESTING = true;</script>
<script src="js/sdk.js?v=20261113b"></script>
<script src="js/city.js?v=20261113b"></script>
<script src="js/core.js?v=20261113b"></script>
<script src="js/looks.js?v=20261113b"></script>
<script src="js/audio.js?v=20261113b"></script>
<script src="js/game.js?v=20261113b"></script>
