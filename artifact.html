<title>Hearthgate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="style.css?v=20261105o">
<style>:root{color-scheme:dark} html,body{background:#1b1016}</style>

<div id="backdrop" aria-hidden="true"></div>
<div id="stage">
  <canvas id="field" aria-label="The gate holds against the waves"></canvas>
  <header id="hud">
    <span id="wave" class="chip">Wave 1</span>
    <span class="chip parts"><i class="cog"></i><b id="parts">0</b><span class="unit">Parts</span></span>
    <span id="stars" class="chip" hidden></span>
    <button id="pause" class="icon" aria-label="Pause">II</button>
  </header>
  <div id="counters"><span id="city" class="chip">City 0/10</span><span id="combos" class="chip">Combos 0/3</span></div>
  <div id="toast" role="status"></div>
  <footer id="bar">
    <button id="up" class="big"><span class="fill"></span><span class="label">Upgrade</span><span class="cost">10</span><span class="wait"></span><kbd>U</kbd></button>
    <button id="re" class="big"><span class="fill"></span><span class="label">Restore</span><span class="cost">15</span><span class="wait"></span><kbd>R</kbd></button>
  </footer>
  <div id="hand" aria-hidden="true"></div>
  <div id="card"><div class="body" role="dialog" aria-modal="true"></div></div>
  <div id="boot">Hearthgate</div>
</div>
<script src="js/sdk.js?v=20261105o"></script>
<script src="js/city.js?v=20261105o"></script>
<script src="js/core.js?v=20261105o"></script>
<script src="js/audio.js?v=20261105o"></script>
<script src="js/game.js?v=20261105o"></script>
