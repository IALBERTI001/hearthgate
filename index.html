<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Hearthgate</title>
<link rel="stylesheet" href="style.css?v=20261107i">
</head>
<body>
<div id="backdrop" aria-hidden="true"></div>
<div id="stage">
  <canvas id="field" aria-label="The gate holds against the waves"></canvas>
  <header id="hud">
    <span id="wave" class="chip">Wave 1</span>
    <span class="chip res"><i class="gem"></i><b id="res">0</b><span id="unit" class="unit">Resonance</span></span>
    <button id="stars" class="chip perksbtn" aria-label="Ascension perks" hidden></button>
    <button id="quests" class="icon" aria-label="Daily quests" hidden><i class="scroll"></i><span class="dot"></span></button>
    <button id="shop" class="icon shopbtn" aria-label="Shop" hidden><i class="star"></i><span class="dot"></span></button>
    <button id="surge" aria-label="Resonance Surge" hidden></button>
    <button id="stats" class="icon statsbtn" aria-label="Show stats"><i class="bars"></i></button>
    <button id="pause" class="icon" aria-label="Pause">II</button>
  </header>
  <div id="counters"><span id="city" class="chip">City 0/10</span><span id="rate" class="chip rate" hidden><i class="gem"></i><b id="rateN">+0/s</b></span><span id="combos" class="chip">Combos 0/3</span></div>
  <div id="toast" role="status"></div>
  <footer id="bar">
    <button id="up" class="big"><span class="fill"></span><span class="label">Upgrade</span><span class="cost">10</span><span class="wait"></span><kbd>U</kbd></button>
    <button id="re" class="big"><span class="fill"></span><span class="label">Restore</span><span class="cost">15</span><span class="wait"></span><kbd>R</kbd></button>
  </footer>
  <div id="hand" aria-hidden="true"></div>
  <div id="card"><div class="body" role="dialog" aria-modal="true"></div></div>
  <div id="boot">Hearthgate</div>
</div>
<aside id="sideL" class="side" hidden></aside>
<aside id="sideR" class="side" hidden></aside>
<script src="js/sdk.js?v=20261107i"></script>
<script src="js/city.js?v=20261107i"></script>
<script src="js/core.js?v=20261107i"></script>
<script src="js/looks.js?v=20261107i"></script>
<script src="js/audio.js?v=20261107i"></script>
<script src="js/game.js?v=20261107i"></script>
</body>
</html>
